# Simple Automated GitHub Pages Deployment Workflow
# Whenever you push/upload your code to GitHub, this action builds your React + Vite App and deploys it to GitHub Pages!

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Compile and Build React + Vite Web App
        run: npm run build

      - name: Setup Pages Build Artifacts
        uses: actions/configure-pages@v4

      - name: Upload Build Output Directory (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy Live Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
