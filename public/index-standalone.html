      // ── NIC Validator helper ──────────────────────────────────────────────────
      function validateNIC(nic) {
        const val = (nic || '').trim();
        if (!val) return { ok: false, msg: 'NIC / Passport number is required.' };
        if (val.length === 10) {
          const first9 = val.substring(0, 9);
          const last = val[9].toUpperCase();
          if (/^\d{9}$/.test(first9) && (last === 'V' || last === 'X')) {
            return { ok: true, msg: 'Old NIC format. Valid.' };
          }
        }
        if (val.length === 12 && /^\d{12}$/.test(val)) {
          return { ok: true, msg: 'New NIC format. Valid.' };
        }
        if (val.length >= 6 && val.length <= 15 && /^[a-zA-Z0-9]+$/.test(val)) {
          return { ok: true, msg: 'Passport format. Valid.' };
        }
        return { ok: false, msg: 'Invalid NIC format! Must be 9 numbers + V/X, or 12 numbers, or standard passport code.' };
      }

      // ── Main Controller Hook (Replaces Firebase Backend with LocalStorage) ─────
      function App() {
        const [view, setView] = React.useState('dashboard');
        
        // Synced local states
        const [config, setConfig] = React.useState(() => {
          const cached = localStorage.getItem('vms_config');
          return cached ? JSON.parse(cached) : DEFAULT_CONFIG;
        });

        const [zones, setZones] = React.useState(() => {
          const cached = localStorage.getItem('vms_zones');
          return cached ? JSON.parse(cached) : DEFAULT_ZONES;
        });

        const [hosts, setHosts] = React.useState(() => {
          const cached = localStorage.getItem('vms_hosts');
          return cached ? JSON.parse(cached) : DEFAULT_HOSTS;
        });

        const [preRegs, setPreRegs] = React.useState(() => {
          const cached = localStorage.getItem('vms_preregs');
          return cached ? JSON.parse(cached) : DEFAULT_PREREGS;
        });

        const [visitors, setVisitors] = React.useState(() => {
          const cached = localStorage.getItem('vms_visitors');
          return cached ? JSON.parse(cached) : DEFAULT_VISITORS;
        });

        // Save changed lists to localStorage
        React.useEffect(() => {
          localStorage.setItem('vms_config', JSON.stringify(config));
        }, [config]);

        React.useEffect(() => {
          localStorage.setItem('vms_zones', JSON.stringify(zones));
        }, [zones]);

        React.useEffect(() => {
          localStorage.setItem('vms_hosts', JSON.stringify(hosts));
        }, [hosts]);

        React.useEffect(() => {
          localStorage.setItem('vms_preregs', JSON.stringify(preRegs));
        }, [preRegs]);

        React.useEffect(() => {
          localStorage.setItem('vms_visitors', JSON.stringify(visitors));
        }, [visitors]);

        // Screen parameters and state
        const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);
        const [adminUnlocked, setAdminUnlocked] = React.useState(false);
        const [customAlert, setCustomAlert] = React.useState(null);
        const [customConfirm, setCustomConfirm] = React.useState(null);

        const showAlert = (message, title = 'Notification') => {
          setCustomAlert({ message, title });
        };

        const showConfirm = (message, onConfirm, title = 'Confirmation') => {
          setCustomConfirm({
            message,
            onConfirm: () => {
              onConfirm();
              setCustomConfirm(null);
            },
            title
          });
        };

        // Utility: Compute remaining passive pools
        const getPassPool = () => {
          const defaultPools = { G: [], Y: [], A: [], R: [] };
          const onSitePasses = visitors.filter(v => v.status === 'in').map(v => v.pass);
          
          ['G', 'Y', 'A', 'R'].forEach(pfx => {
            const max = config.passTotals[pfx] || 0;
            const pool = [];
            for (let i = 1; i <= max; i++) {
              const code = pfx + String(i).padStart(2, '0');
              if (!onSitePasses.includes(code)) {
                pool.push(code);
              }
            }
            defaultPools[pfx] = pool;
          });
          return defaultPools;
        };

        const getHighestColor = (selectedZ) => {
          const rank = { green: 1, yellow: 2, amber: 3, red: 4 };
          let bestColor = 'green';
          let bestRank = 0;
          selectedZ.forEach(zname => {
            const liveZ = zones.find(z => z.name === zname);
            if (liveZ && rank[liveZ.color] > bestRank) {
              bestColor = liveZ.color;
              bestRank = rank[liveZ.color];
            }
          });
          return bestColor;
        };

        // Web triggers and mutations
        const handlePreRegSubmit = async (prData) => {
          const nextPrSeq = config.prSeq;
          const prId = 'PR' + String(nextPrSeq).padStart(4, '0');
          const newPr = {
            ...prData,
            id: prId,
            status: 'pending',
            submittedAt: new Date().toISOString()
          };
          setPreRegs(prev => [newPr, ...prev]);
          setConfig(prev => ({ ...prev, prSeq: nextPrSeq + 1 }));
          showAlert(`Pre-Registration generated successfully under ID #${prId}.`, 'Registration Success');
        };

        const handleCancelPreReg = async (id) => {
          setPreRegs(prev => prev.map(p => p.id === id ? { ...p, status: 'cancelled' } : p));
          showAlert(`Pre-registration #${id} has been marked as cancelled.`, 'Status');
        };

        const handleAbsentMember = async (prId, memberNic) => {
          setPreRegs(prev => prev.map(p => {
            if (p.id === prId) {
              return { ...p, members: p.members.filter(m => m.nic.toLowerCase() !== memberNic.toLowerCase()) };
            }
            return p;
          }));
        };

        const handleCheckinPreReg = async (prId, filteredMembers) => {
          const pr = preRegs.find(p => p.id === prId);
          if (!pr) throw new Error('Pre-Registration record not found.');
          
          const activeMembers = filteredMembers || pr.members;
          if (activeMembers.length === 0) throw new Error('No visit active delegation rows.');
          
          const leader = activeMembers.find(m => m.isLeader) || activeMembers[0];
          const color = getHighestColor(leader.zones || []);
          
          const pfx = { green: 'G', yellow: 'Y', amber: 'A', red: 'R' }[color];
          const pool = getPassPool()[pfx] || [];
          let passCode = '';
          
          if (pool.length > 0) {
            passCode = pool[0];
          } else {
            const expandedMax = (config.passTotals[pfx] || 0) + 1;
            setConfig(prev => ({
              ...prev,
              passTotals: { ...prev.passTotals, [pfx]: expandedMax }
            }));
            passCode = pfx + String(expandedMax).padStart(2, '0');
          }

          const targetHost = hosts.find(h => h.name === leader.hostName) || { name: leader.hostName, designation: 'Guest Host', dept: 'N/A', phone: '' };
          const nextIdSeq = config.idSeq;

          const record = {
            id: String(nextIdSeq),
            prId: pr.id,
            name: leader.name,
            nic: leader.nic,
            phone: leader.phone || '',
            company: leader.company || '',
            purpose: leader.purpose || '',
            hostName: targetHost.name,
            hostDesignation: targetHost.designation,
            hostDept: targetHost.dept || 'Department',
            hostPhone: targetHost.phone || '',
            vehicle: leader.vehicle || '',
            zones: leader.zones || [],
            color,
            pass: passCode,
            isGroup: pr.type === 'group',
            groupCount: activeMembers.length,
            groupMembers: activeMembers.filter(m => !m.isLeader).map(m => ({ name: m.name, nic: m.nic, company: m.company || '' })),
            drivers: pr.drivers || [],
            photoAllowed: pr.photoAllowed,
            status: 'in',
            checkIn: new Date().toISOString(),
            checkOut: null
          };

          setVisitors(prev => [record, ...prev]);
          setPreRegs(prev => prev.map(p => p.id === pr.id ? { ...p, status: 'checked-in', visitorId: record.id } : p));
          setConfig(prev => ({ ...prev, idSeq: nextIdSeq + 1 }));

          showAlert(`Successfully checked-in ${record.isGroup ? `Group of ${record.groupCount}` : record.name}. Pass Code Card: ${passCode}`, 'Check-in Action Completed');
          setView('dashboard');
          return record;
        };

        const handleWalkinCheckinSubmit = async (walkinData) => {
          const color = getHighestColor(walkinData.zones || []);
          const pfx = { green: 'G', yellow: 'Y', amber: 'A', red: 'R' }[color];
          const pool = getPassPool()[pfx] || [];

          const nextValSeq = config.idSeq;

          const record = {

            name: walkinData.name,
            nic: walkinData.nic,
            phone: walkinData.phone || '',
            company: walkinData.company || '',
            purpose: walkinData.purpose || '',
            hostName: targetHost.name,
            hostDesignation: targetHost.designation,
            hostDept: targetHost.dept || 'Staff Office',
            hostPhone: targetHost.phone || '',
            vehicle: walkinData.vehicle || '',
            zones: walkinData.zones || [],
            color,
            pass: passCode,
            isGroup: false,
            groupCount: 1,
            groupMembers: [],
            drivers: walkinData.drivers || [],
            photoAllowed: walkinData.photoAllowed,
            status: 'in',
            checkIn: new Date().toISOString(),
            checkOut: null
          };

          setVisitors(prev => [record, ...prev]);
          setConfig(prev => ({ ...prev, idSeq: nextValSeq + 1 }));
          showAlert(`Walk-in guest "${record.name}" successfully checked in. Pass card allocated: ${passCode}`, 'Welcome to Lanka Tiles');
          setView('dashboard');
          return record;
        };

        const handleCheckout = (id) => {
          const v = visitors.find(x => x.id === id);
          if (!v) return;
          showConfirm(
            v.isGroup 
              ? `Checkout full group of ${v.groupCount} delegates from the site? All allocated badges will be returned.` 
              : `Checkout guest "${v.name}"? This returns pass card "${v.pass}" into the active pool.`,
            () => {
              setVisitors(prev => prev.map(x => x.id === id ? { ...x, status: 'out', checkOut: new Date().toISOString() } : x));
              showAlert(`Successfully checked out ${v.name}.`, 'Departure Complete');
            }
          );
        };

        const handleForceCheckout = async (id) => {
          setVisitors(prev => prev.map(x => x.id === id ? { ...x, status: 'out', checkOut: new Date().toISOString() } : x));
        };

        const handleSingleHostAdd = async (h) => {
          setHosts(prev => {
            const list = prev.filter(x => x.name.toLowerCase() !== h.name.toLowerCase());
            return [h, ...list];

        const handleHostDelete = async (name) => {
          setHosts(prev => prev.filter(x => x.name !== name));

        const handleZoneAdd = async (z) => {
          setZones(prev => {

            return [z, ...list];

      // ── Pre-Registration View Subcomponent ────────────────────────────────────
      function PreRegistrationView({ preRegs, hosts, zones, onSubmitPreReg, onCancelPreReg, showAlert, showConfirm }) {
        const [formStep, setFormStep] = React.useState(1);
        const [prType, setPrType] = React.useState('individual');
        const [name, setName] = React.useState('');
        const [nic, setNic] = React.useState('');
        const [phone, setPhone] = React.useState('');
        const [company, setCompany] = React.useState('');
        const [hostName, setHostName] = React.useState('');
        const [purpose, setPurpose] = React.useState('');
        const [vehicle, setVehicle] = React.useState('');
        const [photoAllowed, setPhotoAllowed] = React.useState(null);
        const [selectedZones, setSelectedZones] = React.useState([]);
        
        // Group & driver rows
        const [groupRows, setGroupRows] = React.useState([]);
        const [drivers, setDrivers] = React.useState([]);
        const [nicHint, setNicHint] = React.useState('');
        const [isSubmitting, setIsSubmitting] = React.useState(false);
        const [searchQuery, setSearchQuery] = React.useState('');

        const handleNicChange = (val) => {
          setNic(val);
          if (val.trim()) {
            const check = validateNIC(val);
            setNicHint(check.msg);
          } else {
            setNicHint('');
          }
        };

        const toggleZone = (zname) => {
          setSelectedZones(prev => 
            prev.includes(zname) ? prev.filter(z => z !== zname) : [...prev, zname]
          );
        };

        const handleAddGroupRow = () => {
          setGroupRows(prev => [...prev, { name: '', nic: '' }]);
        };

        const handleRemoveGroupRow = (idx) => {
          setGroupRows(prev => prev.filter((_, i) => i !== idx));
        };

        const handleGroupRowChange = (idx, field, val) => {
          setGroupRows(prev => prev.map((row, i) => i === idx ? { ...row, [field]: val } : row));
        };

        const handleAddDriver = () => {
          setDrivers(prev => [...prev, { name: '', nic: '', vehicle: '' }]);
        };

        const handleRemoveDriver = (idx) => {
          setDrivers(prev => prev.filter((_, i) => i !== idx));
        };

        const handleDriverChange = (idx, field, val) => {
          setDrivers(prev => prev.map((drv, i) => i === idx ? { ...drv, [field]: val } : drv));
        };

        // Form page checks
        const validateMobileStep1 = () => {
          if (!name.trim()) { showAlert('Visitor Leader name is required.', 'Blank Field'); return false; }
          const check = validateNIC(nic);
          if (!check.ok) { showAlert(check.msg, 'Validation Alert'); return false; }
          if (!phone.trim()) { showAlert('Contact phone number required.', 'Blank Field'); return false; }
          return true;
        };

        const validateMobileStep2 = () => {
          if (!hostName) { showAlert('Please select an employee host.', 'Host Required'); return false; }
          if (!purpose.trim()) { showAlert('Purpose of visit is required.', 'Purpose Required'); return false; }
          if (photoAllowed === null) { showAlert('Photography permission is mandatory.', 'Permission Required'); return false; }
          return true;
        };

        const handleSubmit = async (e) => {
          if (e) e.preventDefault();
          if (!name.trim() || !nic.trim() || !phone.trim() || !hostName || !purpose.trim() || photoAllowed === null || selectedZones.length === 0) {
            showAlert('Please complete all mandatory fields flagged with * including Access Zones.', 'Validation Error');
            return;
          }

          setIsSubmitting(true);
          try {
            const membersList = [
              {
                name,
                nic,
                phone,
                company,
                purpose,
                vehicle,
                zones: selectedZones,
                hostName,
                isLeader: true
              }
            ];

            if (prType === 'group') {
              for (const row of groupRows) {
                if (!row.name.trim() || !row.nic.trim()) {
                  throw new Error('All delegation group rows require a Name and valid NIC.');
                }
                membersList.push({
                  name: row.name,
                  nic: row.nic,
                  company,
                  purpose,
                  zones: selectedZones,
                  hostName,
                  isLeader: false
                });
              }
            }

            await onSubmitPreReg({
              type: prType,
              status: 'pending',
              photoAllowed,
              members: membersList,
              drivers: drivers
            });

            // reset state
            setName('');
            setNic('');
            setPhone('');
            setCompany('');
            setHostName('');
            setPurpose('');
            setVehicle('');
            setPhotoAllowed(null);
            setSelectedZones([]);
            setGroupRows([]);
            setDrivers([]);
            setFormStep(1);
          } catch (err) {
            showAlert(err.message, 'Form Submission Failed');
          } finally {
            setIsSubmitting(false);
          }
        };

        const filteredPrs = preRegs.filter(p => {
          const leader = p.members.find(m => m.isLeader) || p.members[0];
          return (
            p.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
            leader.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            leader.nic.toLowerCase().includes(searchQuery.toLowerCase())
          );
        });

        return (
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            {/* Form Column */}
            <div class="lg:col-span-8 bg-white border border-lt-border rounded-xl shadow-3xs overflow-hidden">
              <div class="bg-gray-50 border-b border-lt-border px-5 py-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-4 bg-lt-red rounded-2xs"></span>
                  <h3 class="font-display font-black text-xs text-lt-navy uppercase tracking-wider">Generate Guest Pre-Registration</h3>
                </div>
                <span class="text-[10px] font-black text-lt-red font-mono bg-lt-red-lt rounded-full px-2.5 py-0.5 border border-lt-red-bd">Lanka Tiles Plant Authorization</span>
              </div>

              {/* Responsive Wizard Step Tracking Form (Excellent for Mobile) */}
              <div class="p-5 space-y-5">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2 font-display text-[10.5px] font-bold uppercase text-slate-800">
                  <span>Navigation steps</span>
                  <span class="bg-lt-navy text-white px-2.5 py-0.5 rounded-full text-[9.5px]">Step {formStep} of 3</span>
                </div>
                <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden">
                  <div class="bg-lt-red h-full transition-all duration-300" style={{ width: `${(formStep / 3) * 100}%` }} />
                </div>

                {/* Step 1: Guest Identity */}
                {formStep === 1 && (
                  <div class="space-y-4">
                    <div class="bg-slate-50 border border-slate-200 p-3 rounded-lg flex flex-col gap-1">
                      <span class="text-[9px] uppercase font-black text-slate-500 tracking-wider">Visitor Classification</span>
                      <div class="grid grid-cols-2 gap-2 mt-1">
                        <button type="button" onClick={() => setPrType('individual')} class={`py-2 px-3 text-xs font-bold rounded border cursor-pointer ${prType === 'individual' ? 'bg-lt-navy text-white border-lt-navy font-black shadow-3xs' : 'bg-white text-slate-705 border-slate-2a0 hover:bg-slate-50'}`}>
                          👤 Individual Pass
                        </button>
                        <button type="button" onClick={() => setPrType('group')} class={`py-2 px-3 text-xs font-bold rounded border cursor-pointer ${prType === 'group' ? 'bg-lt-navy text-white border-lt-navy font-black shadow-3xs' : 'bg-white text-slate-705 border-slate-2a0 hover:bg-slate-50'}`}>
                          👥 Delegation Group
                        </button>
                      </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div class="flex flex-col gap-1">
                        <label class="text-[10px] uppercase font-bold text-lt-muted tracking-wide">Visitor / Leader Name <span class="text-lt-red">*</span></label>
                        <input type="text" value={name} onChange={e => setName(e.target.value.replace(/[^a-zA-Z\s.\-']/g, ''))} class="inp w-full" placeholder="Rohan Karunaratne" />
                      </div>
                      <div class="flex flex-col gap-1">
                        <label class="text-[10px] uppercase font-bold text-lt-muted tracking-wide">NIC / Passport Number <span class="text-lt-red">*</span></label>
                        <input type="text" value={nic} onChange={e => handleNicChange(e.target.value)} class="inp w-full" placeholder="199203112244 or N0129382" />
                        {nicHint && <span class="text-[10px] font-bold text-slate-400 mt-0.5 font-mono">{nicHint}</span>}
                      </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div class="flex flex-col gap-1">
                        <label class="text-[10px] uppercase font-bold text-lt-muted tracking-wide">Contact Phone No. <span class="text-lt-red">*</span></label>
                        <input type="tel" value={phone} onChange={e => setPhone(e.target.value.replace(/\D/g, ''))} class="inp w-full" placeholder="0777123456" />
                      </div>
                      <div class="flex flex-col gap-1">
                        <label class="text-[10px] uppercase font-bold text-lt-muted tracking-wide">Company / Organization <span class="text-slate-400 font-semibold">(Optional)</span></label>
                        <input type="text" value={company} onChange={e => setCompany(e.target.value)} class="inp w-full" placeholder="Hayleys Fabric" />
                      </div>
                    </div>

                    <div class="pt-2">
                      <button type="button" onClick={() => { if (validateMobileStep1()) setFormStep(2); }} class="w-full btn btn-primary py-2.5 justify-center">
                        Continue to Visit Details &rarr;
                      </button>
                    </div>
                  </div>
                )}

                {/* Step 2: Host & Target Details */}
                {formStep === 2 && (
                  <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div class="flex flex-col gap-1">
                        <label class="text-[10px] uppercase font-bold text-lt-muted tracking-wide">Host Employee <span class="text-lt-red">*</span></label>
                        <select value={hostName} onChange={e => setHostName(e.target.value)} class="inp w-full bg-white text-slate-800">
                          <option value="">Select Host…</option>
                          {hosts.map(h => (
                            <option key={h.name} value={h.name}>{h.name} — {h.designation} {h.dept ? `(${h.dept})` : ''}</option>
                          ))}
                        </select>
                      </div>
                      <div class="flex flex-col gap-1">
                        <label class="text-[10px] uppercase font-bold text-lt-muted tracking-wide">Purpose of Visit <span class="text-lt-red">*</span></label>
                        <input type="text" value={purpose} onChange={e => setPurpose(e.target.value)} class="inp w-full" placeholder="Machinery Supplier Audit" />
                      </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div class="flex flex-col gap-1">
                        <label class="text-[10px] uppercase font-bold text-lt-muted tracking-wide">Vehicle Plate Number <span class="text-slate-400 font-semibold">(Optional)</span></label>
                        <input type="text" value={vehicle} onChange={e => setVehicle(e.target.value)} class="inp w-full" placeholder="WP CAS-4829" />
                      </div>
                      <div class="flex flex-col gap-1 bg-rose-50/10 p-3 border border-slate-100 rounded-lg">
                        <label class="text-[10px] uppercase font-bold text-lt-muted tracking-wide">Photography Permission <span class="text-lt-red">*</span></label>
                        <div class="grid grid-cols-2 gap-2 mt-1">
                          <button type="button" onClick={() => setPhotoAllowed(true)} class={`py-1.5 px-3 text-xs font-bold rounded border cursor-pointer select-none transition-all ${photoAllowed === true ? 'bg-emerald-600 text-white border-emerald-600 font-black shadow-xs' : 'bg-white text-slate-705 border-slate-200 hover:bg-slate-50'}`}>
                            Allow ✅
                          </button>
                          <button type="button" onClick={() => setPhotoAllowed(false)} class={`py-1.5 px-3 text-xs font-bold rounded border cursor-pointer select-none transition-all ${photoAllowed === false ? 'bg-rose-600 text-white border-rose-600 font-black shadow-xs' : 'bg-white text-slate-705 border-slate-200 hover:bg-slate-50'}`}>
                            Prohibit ❌
                          </button>
                        </div>
                      </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-2">
                      <button type="button" onClick={() => setFormStep(1)} class="btn btn-ghost py-2.5 justify-center">
                        &larr; Back
                      </button>
                      <button type="button" onClick={() => { if (validateMobileStep2()) setFormStep(3); }} class="btn btn-primary py-2.5 justify-center">
                        Clearance Zones &rarr;
                      </button>
                    </div>
                  </div>
                )}

                {/* Step 3: Zones and Sub-delegates registration */}
                {formStep === 3 && (
                  <div class="space-y-4">
                    <div class="flex flex-col gap-1.5">
                      <label class="text-[10px] uppercase font-bold text-lt-muted tracking-wide">Authorised Access Zones <span class="text-lt-red">*</span></label>
                      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
                        {zones.map(z => {
                          const isSelected = selectedZones.includes(z.name);
                          const activeColors = {
                            green: 'bg-emerald-500 border-emerald-600 text-white',
                            yellow: 'bg-amber-500 border-amber-600 text-white',
                            amber: 'bg-orange-500 border-orange-600 text-white',
                            red: 'bg-rose-500 border-rose-600 text-white'
                          };
                          const normalColors = {
                            green: 'bg-emerald-50 border-emerald-55 text-emerald-700',
                            yellow: 'bg-amber-50 border-amber-55 text-amber-700',
                            amber: 'bg-orange-50 border-orange-55 text-orange-700',
                            red: 'bg-rose-50 border-rose-55 text-rose-700'
                          };
                          return (
                            <button
                              key={z.name}
                              type="button"
                              onClick={() => toggleZone(z.name)}
                              class={`px-2.5 py-1.5 text-[10px] rounded-lg border font-black text-center cursor-pointer transition-all ${isSelected ? activeColors[z.color] : normalColors[z.color]} hover:bg-slate-100/50`}
                            >
                              {z.name}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* Group rows layout */}
                    {prType === 'group' && (
                      <div class="border border-lt-border rounded-xl p-3 bg-slate-50 space-y-2">
                        <div class="flex items-center justify-between border-b pb-1">
                          <span class="text-[9.5px] font-black text-lt-navy uppercase tracking-wider">Group Delegate Lists</span>
                          <button type="button" onClick={handleAddGroupRow} class="text-[9px] font-black border border-lt-navy/20 bg-white hover:bg-slate-50 text-lt-navy px-2 py-0.5 rounded">
                            + Add Member
                          </button>
                        </div>
                        {groupRows.length === 0 ? (
                          <div class="text-center py-4 text-[10.5px] text-slate-400 italic">No supplemental group rows added. Tap above.</div>
                        ) : (
                          <div class="space-y-2 max-h-40 overflow-y-auto pr-1">
                            {groupRows.map((row, idx) => (
                              <div key={idx} class="bg-white border rounded p-2.5 flex flex-col md:flex-row gap-2 relative shadow-3xs">
                                <span class="bg-slate-100 text-slate-800 text-[8.5px] font-bold px-1.5 py-0.5 rounded h-4 w-12 text-center absolute right-3 md:static md:w-auto">#{idx+1}</span>
                                <input type="text" class="inp flex-1 h-8" placeholder="Member Name *" value={row.name} onChange={e => handleGroupRowChange(idx, 'name', e.target.value.replace(/[^a-zA-Z\s.\-']/g, ''))} />
                                <input type="text" class="inp flex-1 h-8" placeholder="NIC / Passport *" value={row.nic} onChange={e => handleGroupRowChange(idx, 'nic', e.target.value)} />
                                <button type="button" onClick={() => handleRemoveGroupRow(idx)} class="text-xs font-black text-lt-red hover:underline h-8 px-2">Cancel</button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}

                    {/* Drivers column */}
                    <div class="border border-lt-red-bd/20 rounded-xl p-3 bg-rose-50/10 space-y-2">
                      <div class="flex items-center justify-between border-b border-rose-100 pb-1">
                        <span class="text-[9.5px] font-black text-lt-red uppercase tracking-wider">Add Accompanying Drivers</span>
                        <button type="button" onClick={handleAddDriver} class="text-[9px] font-black border border-lt-red-bd bg-white hover:bg-rose-50 text-lt-red px-2 py-0.5 rounded">
                          + Add Driver
                        </button>
                      </div>
                      {drivers.length === 0 ? (
                        <div class="text-[10.5px] text-slate-400 italic">No specific fleet drivers registered for this visitor request.</div>
                      ) : (
                        <div class="space-y-2 max-h-40 overflow-y-auto pr-1">
                          {drivers.map((drv, idx) => (
                            <div key={idx} class="bg-white border rounded p-2.5 space-y-1.5 relative shadow-3xs">
                              <div class="flex justify-between items-center pb-0.5 border-b border-slate-50">
                                <span class="text-[8.5px] font-bold text-lt-red">Accompanying Driver #{idx+1}</span>
                                <button type="button" onClick={() => handleRemoveDriver(idx)} class="text-[10px] text-lt-red hover:underline">Remove</button>
                              </div>
                              <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                                <input type="text" class="inp h-8" placeholder="Driver Name *" value={drv.name} onChange={e => handleDriverChange(idx, 'name', e.target.value.replace(/[^a-zA-Z\s.\-']/g, ''))} />
                                <input type="text" class="inp h-8" placeholder="Driver NIC *" value={drv.nic} onChange={e => handleDriverChange(idx, 'nic', e.target.value)} />
                                <input type="text" class="inp h-8" placeholder="Driver Vehicle No" value={drv.vehicle} onChange={e => handleDriverChange(idx, 'vehicle', e.target.value)} />
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-2">
                      <button type="button" onClick={() => setFormStep(2)} class="btn btn-ghost py-2.5 justify-center">
                        &larr; Back
                      </button>
                      <button type="button" onClick={handleSubmit} disabled={isSubmitting} class="btn btn-primary bg-lt-navy text-white hover:bg-lt-navy-dk py-2.5 justify-center">
                        {isSubmitting ? 'Registering...' : 'Submit Authorization Record ✓'}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* List Column */}
            <div class="lg:col-span-4 bg-white border border-lt-border rounded-xl shadow-3xs overflow-hidden">
              <div class="bg-gray-50 border-b border-lt-border px-4 py-3 flex items-center justify-between">
                <span class="font-display font-black text-2xs text-lt-navy uppercase tracking-wider">Search Active Pre-Registrations</span>
                <span class="text-[9px] font-black text-slate-400 font-mono">Archive Logs</span>
              </div>
              <div class="p-3 bg-slate-50 border-b border-lt-border">
                <input
                  type="text"
                  placeholder="Filter name, NIC, PR..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  class="inp w-full text-xs"
                />
              </div>

              <div class="divide-y divide-slate-100 max-h-[480px] overflow-y-auto">
                {filteredPrs.length === 0 ? (
                  <div class="text-center py-8 text-xs text-slate-400 italic">No preregistre matching your search patterns.</div>
                ) : (
                  filteredPrs.map(pr => {
                    const ldr = pr.members.find(m => m.isLeader) || pr.members[0];
                    const statusColors = {
                      pending: 'bg-amber-100 text-amber-800 border-amber-200',
                      'checked-in': 'bg-emerald-100 text-emerald-800 border-emerald-200',
                      cancelled: 'bg-slate-100 text-slate-500 border-slate-200'
                    };
                    return (
                      <div key={pr.id} class="p-3.5 hover:bg-slate-50 transition-colors flex flex-col gap-1 text-xs text-slate-700">
                        <div class="flex items-center justify-between">
                          <span class="font-mono font-black text-lt-navy">{pr.id}</span>
                          <span class={`text-[8.5px] uppercase font-black px-2 py-0.5 rounded-full border ${statusColors[pr.status]}`}>{pr.status}</span>
                        </div>
                        <div class="font-bold text-slate-800 text-[12.5px] font-display flex items-center gap-1">
                          {ldr.name} 
                          {pr.type === 'group' && <span class="bg-slate-100 text-slate-600 px-1 rounded text-[9.5px]">+{pr.members.length - 1} group</span>}
                        </div>
                        <div class="flex justify-between items-center text-[10.5px] text-slate-400 font-medium">
                          <span>NIC: {ldr.nic}</span>
                          <span>Host: {ldr.hostName}</span>
                        </div>
                        {pr.status === 'pending' && (
                          <div class="flex gap-2 justify-end mt-1.5 border-t border-dashed border-slate-100 pt-2">
                            <button
                              onClick={() => showConfirm(`Mark Pre-Registration #${pr.id} as cancelled?`, () => onCancelPreReg(pr.id))}
                              class="text-[10px] font-black text-lt-red hover:underline cursor-pointer"
                            >
                              Cancel Pass
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          </div>
        );
      }

      // ── Check-In View Subcomponent ────────────────────────────────────────────
      function CheckInView({ preRegs, visitors, hosts, zones, getPassPool, onCheckinPreReg, onWalkinCheckin, onGrdRemoveMember, showAlert, showConfirm }) {
        const [searchNic, setSearchNic] = React.useState('');
        const [matchedPr, setMatchedPr] = React.useState(null);
        const [absentNics, setAbsentNics] = React.useState([]);

        // Walk-In attributes
        const [wiName, setWiName] = React.useState('');
        const [wiNic, setWiNic] = React.useState('');
        const [wiPhone, setWiPhone] = React.useState('');
        const [wiCompany, setWiCompany] = React.useState('');
        const [wiHost, setWiHost] = React.useState('');
        const [wiPurpose, setWiPurpose] = React.useState('');
        const [wiVehicle, setWiVehicle] = React.useState('');
        const [wiPhotoAllowed, setWiPhotoAllowed] = React.useState(null);
        const [wiSelectedZones, setWiSelectedZones] = React.useState([]);
        const [wiDrivers, setWiDrivers] = React.useState([]);

        const [nicHint, setNicHint] = React.useState('');
        const [isSubmitting, setIsSubmitting] = React.useState(false);

        const handleSearchLookup = (e) => {
          if (e) e.preventDefault();
          if (!searchNic.trim()) return showAlert('Enter registered NIC or Passport code.', 'Action Required');
          const pr = preRegs.find(p => p.status === 'pending' && p.members.some(m => m.nic.toLowerCase() === searchNic.toLowerCase().trim()));
          if (!pr) {
            showAlert('No pending pre-registration matches that NIC. Go to walk-in check in register.', 'Lookup Failed');
            setMatchedPr(null);
          } else {
            setMatchedPr(pr);
            setAbsentNics([]);
          }
        };

        const handleCheckinPreRegAction = async () => {
          if (!matchedPr) return;
          setIsSubmitting(true);
          try {
            const filtered = matchedPr.members.filter(m => !absentNics.includes(m.nic));
            await onCheckinPreReg(matchedPr.id, filtered);
            setMatchedPr(null);
            setSearchNic('');
          } catch (err) {
            showAlert(err.message);
          } finally {
            setIsSubmitting(false);
          }
        };

        const toggleAbsent = (nicCode) => {
          setAbsentNics(prev => 
            prev.includes(nicCode) ? prev.filter(n => n !== nicCode) : [...prev, nicCode]
          );
        };

        const toggleWiZone = (zname) => {
          setWiSelectedZones(prev => 
            prev.includes(zname) ? prev.filter(z => z !== zname) : [...prev, zname]
          );
        };

        const handleWiNicChange = (val) => {
          setWiNic(val);
          if (val.trim()) {
            const check = validateNIC(val);
            setNicHint(check.msg);
          } else {
            setNicHint('');
          }
        };

        const handleWiSubmit = async (e) => {
          if (e) e.preventDefault();
          if (!wiName.trim() || !wiNic.trim() || !wiPhone.trim() || !wiHost || !wiPurpose.trim() || wiPhotoAllowed === null || wiSelectedZones.length === 0) {
            showAlert('Please complete all mandatory * fields inside the form first.', 'Fields Guard');
            return;
          }

          setIsSubmitting(true);
          try {
            await onWalkinCheckin({
              name: wiName,
              nic: wiNic,
              phone: wiPhone,
              company: wiCompany,
              hostName: wiHost,
              purpose: wiPurpose,
              vehicle: wiVehicle,
              photoAllowed: wiPhotoAllowed,
              zones: wiSelectedZones,
              drivers: wiDrivers
            });

            // clear states
            setWiName('');
            setWiNic('');
            setWiPhone('');
            setWiCompany('');
            setWiHost('');
            setWiPurpose('');
            setWiVehicle('');
            setWiPhotoAllowed(null);
            setWiSelectedZones([]);
            setWiDrivers([]);
          } catch (err) {
            showAlert(err.message);
          } finally {
            setIsSubmitting(false);
          }
        };

        return (
          <div class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
              {/* Left Column: Pre-Reg Code lookup checks */}
              <div class="bg-white border border-lt-border rounded-xl shadow-3xs overflow-hidden">
                <div class="bg-gray-50 border-b border-lt-border px-5 py-4 flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <span class="w-2.5 h-4 bg-lt-navy rounded-2xs"></span>
                    <h3 class="font-display font-black text-xs text-lt-navy uppercase tracking-wider">Fast Lane Pre-Registration Lookup</h3>
                  </div>
                  <span class="text-[9.5px] font-black text-slate-500 font-mono">NIC Check-In</span>
                </div>

                <div class="p-5 space-y-4">
                  <form onSubmit={handleSearchLookup} class="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="Enter visitor leader identity NIC/Passport" 
                      value={searchNic}
                      onChange={e => setSearchNic(e.target.value)}
                      class="inp flex-1 h-10 text-xs"
                    />
                    <button type="submit" class="btn btn-primary h-10 px-4">
                      Search Directory
                    </button>
                  </form>

      // ── Daily Log Registry View Subcomponent ──────────────────────────────────
      function VisitorLogView({ visitors, onVisitorDelete, onCheckout }) {
        const [search, setSearch] = React.useState('');
        const [statusFilter, setStatusFilter] = React.useState('all');

        const filtered = visitors.filter(v => {
          const mText = (v.name + ' ' + v.nic + ' ' + v.company + ' ' + v.pass).toLowerCase();
          const matchesSearch = mText.includes(search.toLowerCase());
          const matchesStatus = statusFilter === 'all' ? true : v.status === statusFilter;
          return matchesSearch && matchesStatus;
        });

        // Simulating Excel Spreadsheet Export
        const exportExcel = () => {
          let rows = [["Badge ID", "Visitor Name", "NIC/Passport", "Company", "Purpose", "Host Employee", "Pass Color", "Check In Time", "Check Out Time"]];
          filtered.forEach(v => {
            rows.push([
              v.pass,
              v.name,
              v.nic,
              v.company,
              v.purpose,
              v.hostName,
              v.color,
              new Date(v.checkIn).toLocaleString(),
              v.checkOut ? new Date(v.checkOut).toLocaleString() : "ON-SITE"
            ]);
          });
          const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.map(val => `"${val}"`).join(",")).join("\n");
          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", `lanka_tiles_vms_log_${new Date().toISOString().slice(0,10)}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        return (
          <div class="bg-white border border-lt-border rounded-xl shadow-3xs overflow-hidden">
            <div class="bg-gray-50 border-b border-lt-border px-5 py-4 flex flex-col md:flex-row md:items-center justify-between gap-3 text-slate-800">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-4 bg-lt-navy rounded-2xs"></span>
                <h3 class="font-display font-black text-xs text-lt-navy uppercase tracking-wider">Complete Visitor Registry Archive Logs</h3>
              </div>
              <button 
                onClick={exportExcel} 
                class="btn btn-primary bg-emerald-600 hover:bg-emerald-700 btn-sm text-[10.5px]"
              >
                📥 Export Registry Spreadsheet
              </button>
            </div>

            {/* Filter Panel */}
            <div class="p-4 bg-slate-50 border-b border-lt-border flex flex-col sm:flex-row gap-3">
              <input
                type="text"
                placeholder="Search database by guest name, plate or badge..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                class="inp flex-1"
              />
              <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} class="inp w-36 bg-white text-slate-800">
                <option value="all">All Visitors</option>
                <option value="in">Currently In-Site</option>
                <option value="out">Checked Out</option>
              </select>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left font-semibold text-[11.5px] text-slate-800">
                <thead>
                  <tr class="bg-slate-100 border-b text-[10px] text-slate-400 font-bold uppercase select-none">
                    <th class="py-3 px-4">Pass Card ID</th>
                    <th class="py-3 px-4">Visitor/Team</th>
                    <th class="py-3 px-4">NIC/Passport</th>
                    <th class="py-3 px-4">Host Details</th>
                    <th class="py-3 px-4">Authorised Zones</th>
                    <th class="py-3 px-4">Arrival Date/Time</th>
                    <th class="py-3 px-4">Checkout Date/Time</th>
                    <th class="py-3 px-4 text-right">Activity</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  {filtered.length === 0 ? (
                    <tr>
                      <td colspan="8" class="text-center py-10 text-xs italic text-slate-400">No visitors logged inside database registers matching conditions.</td>
                    </tr>
                  ) : (
                    filtered.map(v => {
                      const colorMap = {
                        green: 'bg-emerald-500 text-white',
                        yellow: 'bg-amber-500 text-white',
                        amber: 'bg-orange-500 text-white',
                        red: 'bg-rose-500 text-white'
                      };
                      return (
                        <tr key={v.id} class="hover:bg-slate-50/50 transition-colors">
                          <td class="py-3 px-4">
                            <span class={`px-2 py-0.5 rounded text-[10px] font-mono font-black ${colorMap[v.color]}`}>{v.pass}</span>
                          </td>
                          <td class="py-3 px-4">
                            <div class="flex flex-col font-black">
                              <span>{v.name}</span>
                              <span class="text-[9.5px] font-bold text-slate-400 font-sans">{v.company || 'Private Guest'} {v.isGroup ? `(Group of ${v.groupCount})` : ''}</span>
                            </div>
                          </td>
                          <td class="py-3 px-4 font-mono text-xs">{v.nic}</td>
                          <td class="py-3 px-4 flex flex-col">
                            <span class="font-bold text-slate-700">{v.hostName}</span>
                            <span class="text-[9.5px] text-slate-400">{v.hostDept} — {v.hostDesignation}</span>
                          </td>
                          <td class="py-3 px-4">
                            <div class="flex flex-wrap gap-1 max-w-[140px]">
                              {v.zones.map(z => (
                                <span key={z} class="bg-slate-100 text-[8.5px] font-bold text-slate-600 px-1 py-0.5 rounded">{z}</span>
                              ))}
                            </div>
                          </td>
                          <td class="py-3 px-4 text-slate-500">{new Date(v.checkIn).toLocaleString()}</td>
                          <td class="py-3 px-4 text-slate-500">
                            {v.status === 'in' ? (
                              <span class="text-emerald-600 font-bold animate-pulse-slow">● On Site</span>
                            ) : (
                              new Date(v.checkOut).toLocaleString()
                            )}
                          </td>
                          <td class="py-3 px-4 text-right">
                            {v.status === 'in' && (
                              <button onClick={() => onCheckout(v.id)} class="btn btn-danger btn-xs select-none">Checkout ↩</button>
                            )}
                            <button onClick={() => onVisitorDelete(v.id)} class="text-slate-300 hover:text-lt-red p-1 cursor-pointer">
                              <SvgIcons.Trash />
                            </button>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

        const [np1, setNp1] = React.useState('');

                    };
                    return (
                      <div key={z.name} class="p-3 flex items-center justify-between hover:bg-slate-50 font-bold text-slate-800">
                        <span class="font-black">{z.name}</span>
                        <div class="flex items-center gap-2">
                          <span class={`px-2 py-0.5 rounded text-[8.5px] uppercase font-black border ${badgeStyles[z.color]}`}>{z.color} Group</span>
                          <button onClick={() => onZoneDelete(z.name)} class="text-slate-300 hover:text-lt-red px-1 cursor-pointer">
                            <SvgIcons.Trash />
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
              {/* Safety pass limits capacity panel */}
              <div class="bg-white border rounded-xl shadow-3xs overflow-hidden">
                <div class="bg-gray-50 border-b px-4 py-3 flex items-center justify-between">
                  <span class="font-display font-black text-2xs text-lt-navy uppercase tracking-wider">Pass capacity limits &amp; thresholds</span>
                  <span class="text-[9px] font-black text-slate-400 font-mono">Quotas</span>
                </div>
                <div class="p-5 space-y-4">
                  <div class="grid grid-cols-2 gap-4 text-xs font-semibold text-slate-800">
                    <div class="flex flex-col gap-1">
                      <label class="text-[10px] uppercase font-bold text-lt-muted font-mono">Green Passes Capacity</label>
                      <input type="number" class="inp" value={passTotals.G} onChange={e => setPassTotals({ ...passTotals, G: Number(e.target.value) })} />
                    </div>
                    <div class="flex flex-col gap-1">
                      <label class="text-[10px] uppercase font-bold text-lt-muted font-mono">Yellow Passes Capacity</label>
                      <input type="number" class="inp" value={passTotals.Y} onChange={e => setPassTotals({ ...passTotals, Y: Number(e.target.value) })} />
                    </div>
                    <div class="flex flex-col gap-1">
                      <label class="text-[10px] uppercase font-bold text-lt-muted font-mono">Amber Passes Capacity</label>
                      <input type="number" class="inp" value={passTotals.A} onChange={e => setPassTotals({ ...passTotals, A: Number(e.target.value) })} />
                    </div>
                    <div class="flex flex-col gap-1">
                      <label class="text-[10px] uppercase font-bold text-lt-muted font-mono">Red Passes Capacity</label>
                      <input type="number" class="inp" value={passTotals.R} onChange={e => setPassTotals({ ...passTotals, R: Number(e.target.value) })} />
                    </div>
                  </div>
                  <button onClick={handlePassTotalsUpdateAction} class="btn btn-primary btn-sm mt-1 select-none">💾 Sync Quota Thresholds</button>
                </div>
              </div>

              {/* Master System Keys, database reset */}
              <div class="bg-white border rounded-xl shadow-3xs overflow-hidden text-xs">
                <div class="bg-gray-50 border-b px-4 py-3 flex items-center justify-between">
                  <span class="font-display font-black text-2xs text-lt-navy uppercase tracking-wider">System maintenance, security keys</span>
                  <span class="text-[9px] font-black text-slate-400 font-mono">Danger Zone</span>
                </div>
                
                <div class="p-5 space-y-4 leading-normal font-semibold text-slate-700">
                  <div class="grid grid-cols-2 gap-3">
                    <div class="flex flex-col gap-1">
                      <label class="text-[10px] uppercase font-bold text-lt-muted uppercase">New Password</label>
                      <input type="password" class="inp" value={np1} onChange={e => setNp1(e.target.value)} />
                    </div>
                    <div class="flex flex-col gap-1">
                      <label class="text-[10px] uppercase font-bold text-lt-muted uppercase">Confirm Password</label>
                      <input type="password" class="inp" value={np2} onChange={e => setNp2(e.target.value)} />
                    </div>
                  </div>
                  <button onClick={handlePassUpdate} class="btn btn-primary btn-sm select-none">Update Admin Password</button>

                  <div class="h-[1px] bg-slate-100 my-2"></div>

                  <div class="bg-rose-50 border border-rose-200 rounded p-3 space-y-2">
                    <h5 class="text-[11px] font-black text-lt-red uppercase">Purge Database Registers</h5>
                    <p class="text-[10.5px] text-slate-500 leading-tight">This will permanently delete all visitor registers, outstanding pending pre-registrations, and reset sequences to zero inside SQLite LocalStore.</p>
                    <button 
                      onClick={() => showConfirm('WARNING: This will permanently delete ALL active records and pre-registrations history logs from local storage. Tap Proceed to confirm purge.', () => { onClearAll().then(() => showAlert('Database records cleared successfully.', 'System Purged')); })}
                      class="btn btn-danger btn-xs select-none shadow-3xs"
                    >
                      Purge Active Registry Cache ⚠️
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ── Bootstrap Render application ──────────────────────────────────────────
      const rootDiv = document.getElementById('root');
      const rootElement = ReactDOM.createRoot(rootDiv);
      rootElement.render(<App />);
    </script>
  </body>
</html>
